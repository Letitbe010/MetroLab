name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r tools/oracle/requirements.txt
      - run: npm ci
      # The Python oracle (fractions; sympy for the geometry from phase 2) solves the golden
      # and seeded cases independently; tests/oracle.test.ts compares it with solvers A and B.
      - run: npm run oracle:py
      - run: npx vitest run tests/oracle.test.ts
        env:
          ORACLE_REQUIRED: '1'
